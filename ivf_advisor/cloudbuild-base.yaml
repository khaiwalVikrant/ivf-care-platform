steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.base'
      - '-t'
      - 'us-central1-docker.pkg.dev/ivf-agent/ivf-advisor/base:latest'
      - '.'
    timeout: '3600s'

images:
  - 'us-central1-docker.pkg.dev/ivf-agent/ivf-advisor/base:latest'

timeout: '3600s'

options:
  machineType: 'E2_HIGHCPU_8'
