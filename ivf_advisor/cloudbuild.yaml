steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/ivf-agent/ivf-advisor/app:latest'
      - '.'
    timeout: '1200s'

images:
  - 'us-central1-docker.pkg.dev/ivf-agent/ivf-advisor/app:latest'

timeout: '1200s'

options:
  machineType: 'E2_HIGHCPU_8'
