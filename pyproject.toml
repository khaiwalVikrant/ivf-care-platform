[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivf-agent"
version = "0.1.0"
description = "An AI-powered IVF treatment advisor agent built on Google ADK and Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-speech>=2.0.0",
    "google-cloud-storage>=2.10.0",
    "psycopg2-binary>=2.9.0",
    "numpy>=1.24.0",
    "pydantic>=2.12.0",
    "python-dotenv",
    "gradio==5.7.1",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ivf_advisor*"]